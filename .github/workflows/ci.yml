name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo +stable fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: cargo doc --workspace --no-deps

  small:
    name: Small tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the amaru commit pallas-validate builds
        run: |
          source=$(cargo metadata --format-version 1 --all-features | jq -r '. as $m
            | ($m.packages[] | select(.name == "pallas-validate") | .id) as $validate
            | ($m.resolve.nodes[] | select(.id == $validate) | .deps[] | select(.name == "amaru_uplc_native") | .pkg) as $pkg
            | $m.packages[] | select(.id == $pkg) | .source')
          if [[ ! $source =~ ^git\+([^?#]+)(\?[^#]*)?#([0-9a-f]{40})$ ]]; then
            echo "::error::amaru_uplc_native resolves to '$source', not one git commit"
            exit 1
          fi
          echo "AMARU_URL=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "AMARU_COMMIT=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
          echo "amaru-uplc ${BASH_REMATCH[1]} ${BASH_REMATCH[3]}"
      - name: Fetch amaru at that commit
        run: |
          git init -q amaru
          git -C amaru fetch -q --depth 1 "$AMARU_URL" "$AMARU_COMMIT"
          git -C amaru checkout -q --detach FETCH_HEAD
      - name: Install the amaru toolchain
        working-directory: amaru
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            amaru -> target
          key: ${{ hashFiles('Cargo.toml', 'amaru/Cargo.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Build
        run: cargo build --workspace --all-targets --profile test
      - name: Test
        uses: ./.github/actions/sized-tests
        with:
          size: small
          args: --workspace
      - name: Test blueprint feature
        uses: ./.github/actions/sized-tests
        with:
          size: small
          args: -p pallas-network -p pallas-network2 --features blueprint
      - name: Test unstable feature
        uses: ./.github/actions/sized-tests
        with:
          size: small
          args: -p pallas-primitives -p pallas-traverse -p pallas-utxorpc -p pallas-network2 -p pallas-network -p pallas-hardano --features unstable
      - name: Test unstable blueprint feature
        uses: ./.github/actions/sized-tests
        with:
          size: small
          args: -p pallas-primitives --features unstable,blueprint
      - name: Test unstable validate feature
        uses: ./.github/actions/sized-tests
        with:
          size: small
          args: -p pallas-validate --features unstable
      - name: Test validation with phase two enabled
        uses: ./.github/actions/sized-tests
        with:
          size: small
          args: -p pallas-validate --features phase2
      - name: Test native Dijkstra validation with phase two enabled
        uses: ./.github/actions/sized-tests
        with:
          size: small
          args: -p pallas-validate --features phase2,unstable
      - name: Run the amaru-uplc conformance suite at the pinned commit
        working-directory: amaru
        run: |
          cargo nextest run --locked --no-fail-fast --no-tests fail --color never \
            --config-file "$GITHUB_WORKSPACE/.config/amaru-conformance.toml" -E 'group(small)' \
            -p amaru-uplc --test conformance 2>&1 | tee "$RUNNER_TEMP/conformance.log"
          programs=$(find crates/amaru-uplc/tests/conformance -name '*.uplc' | wc -l)
          summary=$(grep -E '^ *Summary \[' "$RUNNER_TEMP/conformance.log" || true)
          pattern='Summary \[ *[0-9.]+s\] ([0-9]+) tests? run: ([0-9]+) passed, 0 skipped$'
          if [[ ! $summary =~ $pattern ]] || (( programs == 0 || BASH_REMATCH[1] != BASH_REMATCH[2] || BASH_REMATCH[2] < programs )); then
            echo "::error::'$summary' does not pass every one of the $programs conformance programs"
            exit 1
          fi
          echo "$programs programs, ${BASH_REMATCH[2]} tests passed at amaru $AMARU_COMMIT"

  medium:
    name: Medium tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Build
        run: cargo build --workspace --all-targets --profile test
      - name: Test
        uses: ./.github/actions/sized-tests
        with:
          size: medium
          args: --workspace
      - name: Test blueprint feature
        uses: ./.github/actions/sized-tests
        with:
          size: medium
          args: -p pallas-network -p pallas-network2 --features blueprint
      - name: Test unstable feature
        uses: ./.github/actions/sized-tests
        with:
          size: medium
          args: -p pallas-primitives -p pallas-traverse -p pallas-utxorpc -p pallas-network2 -p pallas-network -p pallas-hardano --features unstable
      - name: Test unstable blueprint feature
        uses: ./.github/actions/sized-tests
        with:
          size: medium
          args: -p pallas-primitives --features unstable,blueprint
      - name: Test unstable validate feature
        uses: ./.github/actions/sized-tests
        with:
          size: medium
          args: -p pallas-validate --features unstable
      - name: Test native Dijkstra validation with phase two enabled
        uses: ./.github/actions/sized-tests
        with:
          size: medium
          args: -p pallas-validate --features phase2,unstable

  large:
    name: Large tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Test
        uses: ./.github/actions/sized-tests
        with:
          size: large
          args: --workspace
      - name: Test blueprint feature
        uses: ./.github/actions/sized-tests
        with:
          size: large
          args: -p pallas-network -p pallas-network2 --features blueprint
      - name: Test unstable feature
        uses: ./.github/actions/sized-tests
        with:
          size: large
          args: -p pallas-primitives -p pallas-traverse -p pallas-utxorpc -p pallas-network2 -p pallas-network -p pallas-hardano --features unstable

  features:
    name: Features (${{ matrix.flags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "--no-default-features"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: cargo check --workspace --all-targets ${{ matrix.flags }}

  isolated-features:
    name: Isolated no-default-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      # A workspace-wide --no-default-features build unifies features across
      # members, so it always pulls pallas-primitives in with `json` enabled.
      # Check the crate in isolation to catch missing serde feature gating.
      - run: cargo check -p pallas-primitives --no-default-features

  # main is the v1 lineage, where public API changes must be additive; see
  # "API compatibility" in AGENTS.md. Other targets, such as vnext, may break,
  # and so may pallas-network2, which is experimental and left out of both jobs.
  #
  # Both jobs compare the PR's merge commit with the target branch tip, or a
  # pushed branch with its merge base with txpipe main, so a stale branch
  # doesn't read as removing newer items. Neither tool is enough alone:
  # cargo-semver-checks catches breaks that look like additions but not type
  # changes, and cargo-public-api is the reverse. On a push both jobs report
  # without failing the run, since a pull request into main is where a break
  # blocks.
  api-baseline:
    name: API compatibility (baseline)
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.baseline.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: baseline
        shell: bash
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n $PULL_REQUEST_BASE ]]; then
            rev=$PULL_REQUEST_BASE
          else
            git fetch --no-tags https://github.com/txpipe/pallas.git main
            rev=$(git merge-base HEAD FETCH_HEAD)
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "baseline $rev"

  semver-checks:
    name: API compatibility (semver-checks)
    needs: api-baseline
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ needs.api-baseline.outputs.rev }}
          # The version alone won't do: main can sit on a prerelease.
          release-type: minor
          exclude: pallas-network2

  public-api:
    name: API compatibility (public-api)
    needs: api-baseline
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/public-api-diff
        with:
          # The published crates, except the experimental pallas-network2. Add a
          # new crate here once it's on main; until then the base revision
          # doesn't have it to diff against.
          crates: >-
            pallas
            pallas-addresses
            pallas-codec
            pallas-configs
            pallas-crypto
            pallas-hardano
            pallas-math
            pallas-network
            pallas-primitives
            pallas-traverse
            pallas-txbuilder
            pallas-utxorpc
            pallas-validate
          base: ${{ needs.api-baseline.outputs.rev }}
