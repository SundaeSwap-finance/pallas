name: CI

on:
  push:
    branches: [main, leios-musashi]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo +stable fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Test blueprint feature
        run: cargo test -p pallas-network -p pallas-network2 --features blueprint
      - name: Test unstable feature
        run: cargo test -p pallas-primitives -p pallas-traverse -p pallas-utxorpc -p pallas-validate -p pallas-network2 -p pallas-network -p pallas-hardano --features unstable
      - name: Test unstable blueprint feature
        run: cargo test -p pallas-primitives --features unstable,blueprint
      - name: Test validation with phase two enabled
        run: cargo test -p pallas-validate --features phase2
      - name: Test native Dijkstra validation with phase two enabled
        run: cargo test -p pallas-validate --features phase2,unstable

  features:
    name: Features (${{ matrix.flags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "--no-default-features"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets ${{ matrix.flags }}

  isolated-features:
    name: Isolated no-default-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A workspace-wide --no-default-features build unifies features across
      # members, so it always pulls pallas-primitives in with `json` enabled.
      # Check the crate in isolation to catch missing serde feature gating.
      - run: cargo check -p pallas-primitives --no-default-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - name: Test validation at the minimum supported Rust version
        run: cargo test -p pallas-validate --features phase2,unstable

  amaru-conformance:
    name: amaru-uplc conformance at the pinned commit
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Read the amaru commit pallas-validate builds
        run: |
          source=$(cargo metadata --format-version 1 --all-features | jq -r '. as $m
            | ($m.packages[] | select(.name == "pallas-validate") | .id) as $validate
            | ($m.resolve.nodes[] | select(.id == $validate) | .deps[] | select(.name == "amaru_uplc_native") | .pkg) as $pkg
            | $m.packages[] | select(.id == $pkg) | .source')
          if [[ ! $source =~ ^git\+([^?#]+)(\?[^#]*)?#([0-9a-f]{40})$ ]]; then
            echo "::error::amaru_uplc_native resolves to '$source', not one git commit"
            exit 1
          fi
          echo "AMARU_URL=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "AMARU_COMMIT=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
          echo "amaru-uplc ${BASH_REMATCH[1]} ${BASH_REMATCH[3]}"
      - name: Fetch amaru at that commit
        run: |
          git init -q amaru
          git -C amaru fetch -q --depth 1 "$AMARU_URL" "$AMARU_COMMIT"
          git -C amaru checkout -q --detach FETCH_HEAD
      - name: Install the amaru toolchain
        working-directory: amaru
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: amaru
      - name: Run the amaru-uplc conformance suite
        working-directory: amaru
        run: |
          cargo test --locked -p amaru-uplc --test conformance 2>&1 | tee "$RUNNER_TEMP/conformance.log"
          programs=$(find crates/amaru-uplc/tests/conformance -name '*.uplc' | wc -l)
          result=$(grep '^test result: ' "$RUNNER_TEMP/conformance.log" || true)
          pattern='^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in [0-9.]+s$'
          if [[ ! $result =~ $pattern ]] || (( programs == 0 || BASH_REMATCH[1] < programs )); then
            echo "::error::'$result' does not pass every one of the $programs conformance programs"
            exit 1
          fi
          echo "$programs programs, ${BASH_REMATCH[1]} tests passed at amaru $AMARU_COMMIT"

  # main is the v1 lineage, where public API changes must be additive; see
  # "API compatibility" in AGENTS.md. Other targets, such as vnext, may break.
  #
  # Both jobs compare the PR's merge commit with the target branch tip, or a
  # pushed branch with its merge base with txpipe main, so a stale branch
  # doesn't read as removing newer items. Neither tool is enough alone:
  # cargo-semver-checks catches breaks that look like additions but not type
  # changes, and cargo-public-api is the reverse. On a push both jobs report
  # without failing the run, since a pull request into main is where a break
  # blocks.
  api-baseline:
    name: API compatibility (baseline)
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.baseline.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: baseline
        shell: bash
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n $PULL_REQUEST_BASE ]]; then
            rev=$PULL_REQUEST_BASE
          else
            git fetch --no-tags https://github.com/txpipe/pallas.git main
            rev=$(git merge-base HEAD FETCH_HEAD)
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "baseline $rev"

  semver-checks:
    name: API compatibility (semver-checks)
    needs: api-baseline
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ needs.api-baseline.outputs.rev }}
          # The version alone won't do: main can sit on a prerelease.
          release-type: minor

  public-api:
    name: API compatibility (public-api, ${{ matrix.crate }})
    needs: api-baseline
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The published crates. Add a new crate here once it's on main; until
        # then the base revision doesn't have it to diff against.
        crate:
          - pallas
          - pallas-addresses
          - pallas-codec
          - pallas-configs
          - pallas-crypto
          - pallas-hardano
          - pallas-math
          - pallas-network
          - pallas-network2
          - pallas-primitives
          - pallas-traverse
          - pallas-txbuilder
          - pallas-utxorpc
          - pallas-validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/public-api-diff
        with:
          crate: ${{ matrix.crate }}
          base: ${{ needs.api-baseline.outputs.rev }}
