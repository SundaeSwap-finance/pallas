name: Public API diff
description: Fail if any of the crates' public API changed or lost items since the base revision. Additions pass.

inputs:
  crates:
    description: The workspace packages to diff, separated by whitespace.
    required: true
  base:
    description: The revision to diff against. It must be fetched.
    required: true

runs:
  using: composite
  steps:
    # cargo-public-api reads nightly rustdoc JSON, whose format changes often.
    # Bump the tool and the nightly (both uses) together, per the tool's
    # compatibility matrix.
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-05-25
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: public-api-diff-${{ hashFiles('Cargo.toml') }}
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-public-api@0.52.0
    - shell: bash
      env:
        CRATES: ${{ inputs.crates }}
        BASE: ${{ inputs.base }}
      run: |
        failed=()
        for crate in $CRATES; do
          echo "::group::$crate"
          if ! cargo +nightly-2026-05-25 public-api -p "$crate" diff --deny=changed --deny=removed "$BASE..$GITHUB_SHA"; then
            failed+=("$crate")
          fi
          echo "::endgroup::"
        done
        if (( ${#failed[@]} > 0 )); then
          echo "::error::public API changed or lost items in ${failed[*]}"
          exit 1
        fi
