name: Sized tests
description: Run the tests of one size under its time limit, and after the small tests the doctests.

inputs:
  args:
    description: The cargo package and feature arguments that select the tests.
    required: true
  size:
    description: The test group of .config/nextest.toml to run, small, medium or large.
    required: true

runs:
  using: composite
  steps:
    - name: Tests
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        SIZE: ${{ inputs.size }}
      run: |
        # shellcheck disable=SC2086
        cargo nextest run --no-fail-fast --no-tests fail --run-ignored all -E "group($SIZE)" $ARGS
    - name: Doctests
      if: inputs.size == 'small'
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: timeout 60
      run: |
        # shellcheck disable=SC2086
        cargo test --doc $ARGS
