[package]
name = "pallas-validate"
description = "Utilities for validating transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
documentation = "https://docs.rs/pallas-validate"
readme = "README.md"

[dependencies]
pallas-addresses.workspace = true
pallas-codec.workspace = true
pallas-crypto.workspace = true
pallas-primitives.workspace = true
pallas-traverse.workspace = true
hex.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde.workspace = true
itertools.workspace = true
tracing.workspace = true

# phase2 dependencies
# Earlier eras use the registry release, and native Dijkstra under unstable uses the protocol aware fork.
amaru-uplc = { version = "=0.1.0", optional = true }
amaru-uplc-native = { package = "amaru-uplc", git = "https://github.com/SundaeSwap-finance/amaru.git", rev = "ede1c76be037b16412c24b2590456e0fdee8fe4a", optional = true }
amaru-kernel = { git = "https://github.com/SundaeSwap-finance/amaru.git", rev = "ede1c76be037b16412c24b2590456e0fdee8fe4a", optional = true }
blst = { version = "0.3", optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
phase2 = ["amaru-uplc"]
unstable = [
    "pallas-traverse/unstable",
    "pallas-primitives/unstable",
    "dep:amaru-uplc-native",
    "dep:amaru-kernel",
    "dep:blst",
]
