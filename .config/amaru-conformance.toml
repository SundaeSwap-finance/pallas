# Every amaru-uplc conformance test evaluates one program in memory, so each is small.
# The time limit is Bazel's default, https://bazel.build/reference/test-encyclopedia#role-test-runner.

[test-groups]
small = { max-threads = "num-cpus" }

[[profile.default.overrides]]
filter = 'all()'
test-group = "small"
slow-timeout = { period = "60s", terminate-after = 1 }
