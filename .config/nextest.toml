# A test is large when it dials a public network peer, medium when it reads a file outside its temporary directory, opens a socket or starts a process, and small otherwise.
# Each size's time limit is Bazel's default, https://bazel.build/reference/test-encyclopedia#role-test-runner.

[test-groups]
small = { max-threads = "num-cpus" }
medium = { max-threads = "num-cpus" }
large = { max-threads = "num-cpus" }

[[profile.default.overrides]]
filter = '''
binary_id(pallas-network::protocols)
  & test(/^(blockfetch_happy_path|chainsync_history_happy_path|chainsync_tip_happy_path|txsubmission_submit_to_mainnet_peer_n2n)$/)
'''
test-group = "large"
slow-timeout = { period = "900s", terminate-after = 1 }

